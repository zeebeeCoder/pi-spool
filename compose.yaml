name: pi-spool-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spool
      POSTGRES_PASSWORD: spool
      POSTGRES_DB: spool
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied by the official entrypoint on a fresh volume only.
      - ./sql/spool.sql:/docker-entrypoint-initdb.d/01-spool.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U spool -d spool"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
